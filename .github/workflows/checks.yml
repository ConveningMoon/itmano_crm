name: Checks

# Tipos, lint y las suites que NO tocan la base. Corre en todos los PR: es
# barato, no necesita secretos y atrapa la mayoría de las regresiones antes de
# que nadie mire el diff.
on:
  pull_request:

concurrency:
  group: checks-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Aquí es donde salta un `.select()` con una columna que la vista ya no
      # expone: las listas se validan contra src/lib/supabase/database.types.ts.
      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Suites puras o con el cliente de Supabase mockeado. Las que pegan a la
      # base van en rls-tests.yml, que corre serializado y con secretos.
      #
      # RESEND_API_KEY va con un valor de mentira a proposito. No se manda ni un
      # correo aqui: src/lib/resend.ts valida la clave AL IMPORTARSE, asi que
      # tres suites que solo la arrastran de forma transitiva reventaban al
      # cargar el modulo. Con secretos de verdad este job dejaria de ser el
      # check barato y sin permisos que queremos que sea.
      - name: Unit tests
        env:
          RESEND_API_KEY: test-key-no-envia-nada
        run: npm run test:unit
