name: RLS Tests

# Corre en TODOS los PR, no sólo cuando cambian las migraciones.
#
# El disparador anterior era `paths: supabase/migrations/**`, y parecía
# razonable: si no cambia el esquema, no hace falta re-probarlo. Pero estas
# suites no corren contra el esquema del PR — corren contra la base REMOTA
# compartida, y esa cambia cuando se APLICA la migración, no cuando se mergea
# el archivo.
#
# Pasó exactamente eso: la 083 borró `leads.status` y se aplicó a la base
# después de mergear su PR. Los fixtures siguieron sembrando esa columna, los
# tests quedaron rotos, y ningún PR posterior los ejecutó porque ninguno tocaba
# migraciones. El fallo apareció más tarde, en un PR que no lo había causado.
#
# Correrlas siempre cuesta ~2,5 min y cierra esa ventana ciega.
on:
  pull_request:

# All runs share one remote Supabase database with fixed fixture IDs
# (tests/rls/setup.ts). Two concurrent runs interleave createFixtures/
# cleanupFixtures and delete each other's users/leads mid-suite, so runs
# must be serialized repo-wide — never run two in parallel.
concurrency:
  group: rls-tests-shared-db
  cancel-in-progress: false

jobs:
  rls-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Secuenciales a propósito: scoring y ai-limits usan los MISMOS fixtures
      # que rls (tests/rls/setup.ts). En paralelo se pisarían entre sí igual que
      # dos corridas simultáneas.
      - name: Run DB-backed tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        run: |
          npm run test:rls
          npm run test:scoring
          npm run test:ai-limits
          npm run test:sources
